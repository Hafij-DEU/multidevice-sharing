name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node engine + desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Core tests
        run: pnpm --filter @meshdrop/core test
      - name: Desktop unit tests
        run: pnpm --filter @meshdrop/desktop test
      - name: Desktop e2e (Electron under Xvfb)
        env:
          # Ubuntu 24.04 runners forbid the unprivileged user namespaces Chromium's sandbox needs.
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          pnpm --filter @meshdrop/desktop build
          xvfb-run -a pnpm --filter @meshdrop/desktop e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/desktop/test-results
          if-no-files-found: ignore

  android:
    name: Android engine + app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Engine tests (Java engine + Node interop)
        working-directory: apps/android
        run: gradle :engine:test
      - name: App lint + debug build
        working-directory: apps/android
        run: gradle :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            apps/android/engine/build/reports
            apps/android/app/build/reports
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node engine + desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: { fail-fast: false, matrix: { ev: ['42.11.18', '43.8.4', '41.10.7'] } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meshdrop/desktop add -D electron@${{ matrix.ev }} && pnpm --filter @meshdrop/desktop exec electron --version
      - name: Desktop e2e (Electron under Xvfb)
        env:
          # Ubuntu 24.04 runners forbid the unprivileged user namespaces Chromium's sandbox needs.
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          pnpm --filter @meshdrop/desktop build
          (while true; do { date -u +%T.%3N; head -1 /proc/loadavg; free -m | sed -n 2,3p; ps -eo pid,ppid,pcpu,rss,etimes,args --sort=-pcpu | head -12 | cut -c1-220; echo; } >> /tmp/md-ps.log; sleep 2; done) &
          (command -v gdb || (sudo apt-get update -q && sudo apt-get install -yq gdb)) >/dev/null 2>&1
          sudo python3 .github/sampler.py > /tmp/md-sampler.log 2>&1 &
          xvfb-run -a pnpm --filter @meshdrop/desktop e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.ev }}
          path: |
            apps/desktop/test-results
            /tmp/md-diag-*.log
            /tmp/md-ps.log
            /tmp/md-sampler.log
            /tmp/md-prof-*.cpuprofile
          if-no-files-found: ignore


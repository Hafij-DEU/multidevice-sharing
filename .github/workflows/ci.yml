name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node engine + desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: { fail-fast: false, matrix: { n: [1, 2] } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Desktop e2e (Electron under Xvfb)
        env:
          # Ubuntu 24.04 runners forbid the unprivileged user namespaces Chromium's sandbox needs.
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          pnpm --filter @meshdrop/desktop build
          xvfb-run -a pnpm --filter @meshdrop/desktop e2e e2e/mesh.spec.ts e2e/remote.spec.ts e2e/send.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.n }}
          path: |
            apps/desktop/test-results
            /tmp/md-diag-*.log
            /tmp/md-prof-*.cpuprofile
          if-no-files-found: ignore


// The MeshDrop engine in plain Java (no Android imports), tested on the JVM against the protocol
// vectors and the Node engine.
plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

test {
    maxHeapSize = '512m'
    systemProperty 'meshdrop.repo', rootDir.parentFile.parentFile.path
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Android's InetAddress.getLoopbackAddress() is ::1; rerun the Bluetooth link tests the way the phone sees it.
tasks.register('btLoopbackTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'io.github.hafijbge.meshdrop.engine.bt.BtLinkTest' }
    systemProperty 'meshdrop.repo', rootDir.parentFile.parentFile.path
    systemProperty 'java.net.preferIPv6Addresses', 'true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
check.dependsOn btLoopbackTest

# .deb for Ubuntu, .rpm for Fedora, a package for Arch, an AppImage and a .tar.gz for any other Linux,
# and the Windows 11 installer (.exe). Build with scripts/build-deb.sh, scripts/build-linux.sh or
# scripts/build-win.ps1 (they run the Vite builds first and keep electron-builder's output out of
# the repository).
appId: io.github.hafijbge.meshdrop
productName: MeshDrop
copyright: Copyright © 2026 Md. Hafijur Rahman
# The UI is English only: ship only Chromium's en-US locale (the other 54 add ~46 MB installed).
electronLanguages:
  - en-US
directories:
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - dist/icons/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: dist/cli/cli.cjs
    to: cli.cjs
  - from: ../browser-extension
    to: browser-extension
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../PRIVACY.md
    to: PRIVACY.md
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
linux:
  target: deb
  # the .tar.gz (unpack and run meshdrop-desktop)
  artifactName: meshdrop-${version}-linux-x64.${ext}
  extraResources:
    - from: build/meshdrop
      to: meshdrop
    - from: build/meshdrop-input.py
      to: meshdrop-input.py
    - from: build/meshdrop-bt.py
      to: meshdrop-bt.py
  category: Network;FileTransfer
  executableName: meshdrop-desktop
  icon: build/icons
  maintainer: Hafij-BGE <mdhafijur.rahman@ogr.deu.edu.tr>
  synopsis: Send files between your devices, on the LAN or through your own hub
  description: >-
    MeshDrop sends files, folders, text and clipboard between your PC and phones, end-to-end
    encrypted, over the local network or through a hub on your own PC. Includes the meshdrop
    command line.
  syncDesktopName: true
  desktop:
    entry:
      Comment: Send files between your devices
      StartupWMClass: meshdrop
      Keywords: share;send;transfer;files;clipboard;
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: MeshDrop
  extraResources:
    - from: build/meshdrop-input.ps1
      to: meshdrop-input.ps1
    - from: build/meshdrop-path.ps1
      to: meshdrop-path.ps1
  # the meshdrop command line, put on PATH by the installer (build/installer.nsh)
  extraFiles:
    - from: build/meshdrop.cmd
      to: bin/meshdrop.cmd
# Like the .deb: installed for every user of the PC (asks for administrator once), with Start menu and
# desktop shortcuts, a firewall rule, the meshdrop command and Explorer's Send to → MeshDrop.
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeshDrop
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: MeshDrop-Setup-${version}.exe
deb:
  packageName: meshdrop
  artifactName: meshdrop_${version}_amd64.deb
  afterInstall: build/after-install.tpl
  afterRemove: build/after-remove.tpl
  # optional helpers, installed with MeshDrop by default: adb (Set up a phone), python3-gi (remote
  # control through the desktop portal, Bluetooth links through BlueZ), PipeWire and GStreamer tools (sound, camera, microphone), lp
  recommends:
    - libappindicator3-1
    - adb
    - python3-gi
    - pipewire-bin
    - gstreamer1.0-tools
    - gstreamer1.0-pipewire
    - gstreamer1.0-plugins-good
    - gstreamer1.0-plugins-bad
    - cups-client
# Fedora / openSUSE: the same /opt/MeshDrop layout and install scripts as the .deb.
rpm:
  packageName: meshdrop
  artifactName: meshdrop-${version}-1.x86_64.rpm
  afterInstall: build/after-install.tpl
  afterRemove: build/after-remove.tpl
  # the .deb's optional helpers under their Fedora names
  fpm:
    - --rpm-tag
    - 'Recommends: android-tools'
    - --rpm-tag
    - 'Recommends: python3-gobject'
    - --rpm-tag
    - 'Recommends: pipewire-utils'
    - --rpm-tag
    - 'Recommends: gstreamer1'
    - --rpm-tag
    - 'Recommends: pipewire-gstreamer'
    - --rpm-tag
    - 'Recommends: gstreamer1-plugins-good'
    - --rpm-tag
    - 'Recommends: gstreamer1-plugins-bad-free'
    - --rpm-tag
    - 'Recommends: cups-client'
    - --rpm-tag
    - 'Recommends: libappindicator-gtk3'
# Arch / Manjaro / EndeavourOS
pacman:
  packageName: meshdrop
  artifactName: meshdrop-${version}-1-x86_64.pkg.tar.zst
  afterInstall: build/after-install.tpl
  afterRemove: build/after-remove.tpl
  # what the bundled Electron needs (electron-builder's default list pulls in ffmpeg and more)
  depends: [gtk3, nss, alsa-lib, libxss, libxtst, at-spi2-core, libnotify, xdg-utils]
  fpm:
    - --pacman-compression=zstd
  # optdepends: scripts/build-linux.sh adds them (fpm 1.17 takes --pacman-optional-depends but never writes it)
# Any other distribution: no install needed (no meshdrop command on PATH and no phone camera device).
appImage:
  artifactName: MeshDrop-${version}-x86_64.AppImage

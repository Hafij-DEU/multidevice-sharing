# .deb for Ubuntu and the Windows 11 installer (.exe). Build with scripts/build-deb.sh or
# scripts/build-win.ps1 (they run the Vite builds first and keep electron-builder's output out of
# the repository).
appId: io.github.hafijbge.meshdrop
productName: MeshDrop
copyright: Copyright © 2026 Hafij-BGE
directories:
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - dist/icons/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: dist/cli/cli.cjs
    to: cli.cjs
  - from: ../browser-extension
    to: browser-extension
linux:
  target: deb
  extraResources:
    - from: build/meshdrop
      to: meshdrop
    - from: build/meshdrop-input.py
      to: meshdrop-input.py
  category: Network;FileTransfer
  executableName: meshdrop-desktop
  icon: build/icons
  maintainer: Hafij-BGE <mdhafijur.rahman@ogr.deu.edu.tr>
  synopsis: Send files between your devices, on the LAN or through your own hub
  description: >-
    MeshDrop sends files, folders, text and clipboard between your PC and phones, end-to-end
    encrypted, over the local network or through a hub on your own PC. Includes the meshdrop
    command line.
  syncDesktopName: true
  desktop:
    entry:
      Comment: Send files between your devices
      StartupWMClass: meshdrop
      Keywords: share;send;transfer;files;clipboard;
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: MeshDrop
  extraResources:
    - from: build/meshdrop-input.ps1
      to: meshdrop-input.ps1
    - from: build/meshdrop-path.ps1
      to: meshdrop-path.ps1
  # the meshdrop command line, put on PATH by the installer (build/installer.nsh)
  extraFiles:
    - from: build/meshdrop.cmd
      to: bin/meshdrop.cmd
# Like the .deb: installed for every user of the PC (asks for administrator once), with Start menu and
# desktop shortcuts, a firewall rule, the meshdrop command and Explorer's Send to → MeshDrop.
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeshDrop
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: MeshDrop-Setup-${version}.exe
deb:
  packageName: meshdrop
  artifactName: meshdrop_${version}_amd64.deb
  afterInstall: build/after-install.tpl
  afterRemove: build/after-remove.tpl
  # optional helpers, installed with MeshDrop by default: adb (Set up a phone), python3-gi (remote
  # control through the desktop portal), PipeWire and GStreamer tools (sound, camera, microphone), lp
  recommends:
    - libappindicator3-1
    - adb
    - python3-gi
    - pipewire-bin
    - gstreamer1.0-tools
    - gstreamer1.0-pipewire
    - gstreamer1.0-plugins-good
    - gstreamer1.0-plugins-bad
    - cups-client
